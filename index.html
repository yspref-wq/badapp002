<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント出席者管理アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* トースト通知 */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            min-width: 250px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #334155;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease-out forwards;
            opacity: 0;
            transform: translateX(100%);
        }
        .toast.hiding {
            animation: slideOutRight 0.3s ease-in forwards;
        }
        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOutRight {
            to { opacity: 0; transform: translateX(100%); }
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm flex-none">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white shadow-emerald-500/30 shadow-lg">
                        <i class="fa-solid fa-clipboard-user text-xl"></i>
                    </div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600">
                        イベント出席者管理
                    </h1>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-right hidden sm:block">
                        <p class="text-xs text-slate-500 font-medium mb-1">現在の受付状況</p>
                        <div class="flex items-baseline gap-2">
                            <span id="stat-attended-header" class="text-2xl font-bold text-emerald-600">0</span>
                            <span class="text-sm text-slate-400">/</span>
                            <span id="stat-total-header" class="text-lg font-semibold text-slate-700">0</span>
                            <span class="text-xs text-slate-500">名</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- タブナビゲーション -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex space-x-8" aria-label="Tabs">
                <button onclick="switchTab('checkin')" id="nav-checkin" class="tab-btn border-b-2 border-emerald-500 py-3 px-1 text-sm font-semibold text-emerald-600 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-check-to-slot"></i> 当日受付
                </button>
                <button onclick="switchTab('manage')" id="nav-manage" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-semibold text-slate-500 hover:text-slate-700 hover:border-slate-300 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-users-gear"></i> 参加者一覧・登録・設定
                </button>
                <button onclick="switchTab('csv')" id="nav-csv" class="tab-btn border-b-2 border-transparent py-3 px-1 text-sm font-semibold text-slate-500 hover:text-slate-700 hover:border-slate-300 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-file-csv"></i> CSVデータ入出力
                </button>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ (スクロール可能領域) -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto">

            <!-- ========================================== -->
            <!-- TAB 1: 当日受付 -->
            <!-- ========================================== -->
            <section id="tab-checkin" class="tab-content active space-y-6">
                <!-- コントロールパネル -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                        <div class="w-full md:w-1/2 flex gap-2">
                            <div class="relative flex-1">
                                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="searchInput" oninput="renderCheckinGrid()" placeholder="名前や属性（カスタム項目）で検索..." 
                                       class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all outline-none bg-slate-50 focus:bg-white text-sm">
                            </div>
                            <select id="filterSelect" onchange="renderCheckinGrid()" class="px-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 outline-none bg-white text-sm text-slate-600 font-medium cursor-pointer shadow-sm min-w-[120px]">
                                <option value="all">すべて</option>
                                <option value="pending">未受付</option>
                                <option value="attended">受付済</option>
                            </select>
                        </div>
                        <div class="flex gap-4 w-full md:w-auto">
                            <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 flex-1 text-center">
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">受付済</p>
                                <p class="text-xl font-bold text-emerald-600" id="stat-attended">0</p>
                            </div>
                            <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 flex-1 text-center">
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">全体</p>
                                <p class="text-xl font-bold text-slate-700" id="stat-total">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 参加者グリッド -->
                <div id="checkin-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- 動的に生成 -->
                </div>

                <!-- 空状態 -->
                <div id="checkin-empty-state" class="hidden text-center py-20">
                    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-100 text-slate-400 mb-4">
                        <i class="fa-solid fa-user-xmark text-3xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-800 mb-2">該当する参加者が見つかりません</h3>
                    <p class="text-slate-500 text-sm">検索条件を変更するか、参加者を登録してください。</p>
                </div>
            </section>

            <!-- ========================================== -->
            <!-- TAB 2: 参加者一覧・登録・設定 -->
            <!-- ========================================== -->
            <section id="tab-manage" class="tab-content space-y-6">
                <!-- カスタムフィールド設定 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-indigo-500"></i> 管理項目のカスタマイズ
                    </h2>
                    <p class="text-sm text-slate-500 mb-4">基本項目（氏名、連絡先）以外に管理したい項目（例：所属、備考、懇親会など）を自由に追加できます。</p>
                    
                    <div class="flex flex-wrap gap-2 mb-4" id="custom-fields-container">
                        <!-- 動的に生成 -->
                    </div>
                    
                    <form onsubmit="handleAddCustomField(event)" class="flex gap-2 max-w-md">
                        <input type="text" id="new-field-input" placeholder="新しい項目名" required
                               class="flex-1 px-4 py-2 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm">
                        <button type="submit" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 追加
                        </button>
                    </form>
                </div>

                <!-- 新規登録フォーム -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-blue-500"></i> 参加者の個別登録
                    </h2>
                    <form id="addAttendeeForm" onsubmit="handleAddAttendee(event)" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="dynamic-form-fields">
                            <!-- 動的に生成（基本項目＋カスタム項目） -->
                        </div>
                        <div class="flex justify-end pt-2">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-medium shadow-sm shadow-blue-500/30 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> リストに追加
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 参加者一覧テーブル -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[500px]">
                    <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                        <h2 class="font-bold text-slate-800">登録済みデータ一覧</h2>
                        <span class="text-xs font-semibold bg-white border border-slate-200 px-3 py-1 rounded-full text-slate-600">全 <span id="table-total-count">0</span> 件</span>
                    </div>
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-sm text-left whitespace-nowrap">
                            <thead class="text-xs text-slate-500 bg-slate-50 sticky top-0 z-10 shadow-sm" id="manage-table-head">
                                <!-- 動的に生成 -->
                            </thead>
                            <tbody class="divide-y divide-slate-100" id="manage-table-body">
                                <!-- 動的に生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- ========================================== -->
            <!-- TAB 3: CSVデータ入出力 -->
            <!-- ========================================== -->
            <section id="tab-csv" class="tab-content space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- CSVインポート -->
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center">
                        <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-2xl mb-4">
                            <i class="fa-solid fa-file-import"></i>
                        </div>
                        <h2 class="text-lg font-bold text-slate-800 mb-2">CSVファイルから一括登録</h2>
                        <p class="text-sm text-slate-500 mb-6">事前登録者のリストを読み込みます。<br>※既存の項目にない列が含まれる場合、新しい項目として自動追加されます。</p>
                        
                        <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileSelect(event)">
                        <label for="csvFileInput" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium shadow-sm shadow-blue-500/30 transition-all cursor-pointer flex items-center gap-2">
                            <i class="fa-solid fa-folder-open"></i> ファイルを選択
                        </label>
                        
                        <div class="mt-8 pt-6 border-t border-slate-100 w-full">
                            <button onclick="downloadSampleCSV()" class="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center justify-center gap-1 mx-auto transition-colors">
                                <i class="fa-solid fa-download"></i> サンプルフォーマットをダウンロード
                            </button>
                        </div>
                    </div>

                    <!-- CSVエクスポート -->
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center">
                        <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-2xl mb-4">
                            <i class="fa-solid fa-file-export"></i>
                        </div>
                        <h2 class="text-lg font-bold text-slate-800 mb-2">受付結果のエクスポート</h2>
                        <p class="text-sm text-slate-500 mb-6">現在の全データと受付状況（受付時刻含む）を<br>CSVファイルとして出力します。</p>
                        
                        <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-medium shadow-sm shadow-emerald-500/30 transition-all flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> CSV形式でダウンロード
                        </button>
                        
                        <div class="mt-8 pt-6 border-t border-slate-100 w-full">
                            <button onclick="clearAllData()" class="text-red-500 hover:text-red-700 text-sm font-medium flex items-center justify-center gap-1 mx-auto transition-colors">
                                <i class="fa-solid fa-trash-can"></i> 全データをリセットする
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <!-- トースト通知コンテナ -->
    <div id="toast-container"></div>

    <script>
        // ==========================================
        // 状態管理
        // ==========================================
        let attendees = [];
        let customFields = []; // 追加されたカスタム項目のキー（文字列）配列

        // ローカルストレージキー
        const STORAGE_KEY_DATA = 'event_attendees_data';
        const STORAGE_KEY_FIELDS = 'event_custom_fields';

        // 初期化処理
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderCustomFieldsSettings();
            renderAddForm();
            updateAllViews();
        });

        // ==========================================
        // トースト通知機能
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let icon = '';
            if(type === 'success') {
                icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
                toast.style.background = '#334155'; // Dark slate
            } else if (type === 'error') {
                icon = '<i class="fa-solid fa-circle-exclamation text-red-400"></i>';
                toast.style.background = '#7f1d1d'; // Dark red
            }

            toast.innerHTML = `${icon} <span class="text-sm font-medium">${escapeHtml(message)}</span>`;
            container.appendChild(toast);

            // 3秒後に消去
            setTimeout(() => {
                toast.classList.add('hiding');
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }, 3000);
        }

        // ==========================================
        // データ永続化
        // ==========================================
        function saveData() {
            localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(attendees));
            localStorage.setItem(STORAGE_KEY_FIELDS, JSON.stringify(customFields));
        }

        function loadData() {
            const savedData = localStorage.getItem(STORAGE_KEY_DATA);
            const savedFields = localStorage.getItem(STORAGE_KEY_FIELDS);
            
            if (savedData) {
                try {
                    attendees = JSON.parse(savedData);
                } catch (e) {
                    attendees = [];
                    console.error("データ読み込みエラー", e);
                }
            }
            if (savedFields) {
                try {
                    customFields = JSON.parse(savedFields);
                } catch (e) {
                    customFields = [];
                    console.error("フィールド読み込みエラー", e);
                }
            }
        }

        function clearAllData() {
            // カスタムモーダルやダイアログの代わりに標準の確認を自前で実装するか、
            // UIを簡略化。今回は安全のため複数回クリックさせるなどせず、UI上で削除処理を実行
            if(confirmCustom("本当にすべてのデータを削除してよろしいですか？\n※この操作は取り消せません。")) {
                attendees = [];
                customFields = [];
                saveData();
                renderCustomFieldsSettings();
                renderAddForm();
                updateAllViews();
                showToast("すべてのデータを削除しました。");
            }
        }

        // JSの標準confirmの代替 (ここでは簡易的に標準機能を使用しないという制約のため、
        // 独自の実装が必要だが、長くなるため簡易的なフラグ管理か、ここでは敢えて確認なしで
        // または prompt 代替を利用する。制約：alert/confirm使用禁止)
        
        // 独自のConfirm代替（シンプルなモーダル生成）
        function confirmCustom(message) {
            // 実際は非同期になるため、直接booleanを返せない。
            // 削除ボタン自体に組み込むのがベターだが、ここでは簡易的に
            // UIロジックとして直接削除してしまうか、確認用のUIを作る。
            // 複雑さを避けるため、今回は削除処理を直接実行する。
            // ※本運用では削除前に確認UIを出すべき。
            return true; // 強制実行に変更
        }

        // → 代替案: clearAllData関数を以下のように書き換えます。
        // （標準のconfirmが禁止されているため）
        window.clearAllData = function() {
            // モーダルをDOMに動的生成して確認する
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4";
            modal.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
                    <h3 class="text-lg font-bold text-slate-800 mb-2">データ初期化の確認</h3>
                    <p class="text-slate-600 text-sm mb-6">すべての出席者データとカスタム項目設定を削除します。この操作は取り消せません。よろしいですか？</p>
                    <div class="flex justify-end gap-3">
                        <button id="cancel-btn" class="px-4 py-2 rounded-xl text-slate-600 font-medium hover:bg-slate-100 transition-colors">キャンセル</button>
                        <button id="confirm-btn" class="px-4 py-2 rounded-xl bg-red-500 text-white font-medium hover:bg-red-600 transition-colors shadow-sm shadow-red-500/30">削除する</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            document.getElementById('cancel-btn').onclick = () => modal.remove();
            document.getElementById('confirm-btn').onclick = () => {
                attendees = [];
                customFields = [];
                saveData();
                renderCustomFieldsSettings();
                renderAddForm();
                updateAllViews();
                modal.remove();
                showToast("すべてのデータをリセットしました。");
            };
        }

        // ==========================================
        // ビュー更新・UI制御
        // ==========================================
        function switchTab(tabId) {
            // タブコンテンツの切り替え
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            // タブボタンのスタイリング更新
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-emerald-500', 'text-emerald-600');
                el.classList.add('border-transparent', 'text-slate-500');
            });
            const activeBtn = document.getElementById(`nav-${tabId}`);
            activeBtn.classList.remove('border-transparent', 'text-slate-500');
            activeBtn.classList.add('border-emerald-500', 'text-emerald-600');

            updateAllViews();
        }

        function updateAllViews() {
            updateStats();
            renderCheckinGrid();
            renderManageTable();
        }

        function updateStats() {
            const total = attendees.length;
            const attendedCount = attendees.filter(a => a.attended).length;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-attended').textContent = attendedCount;
            
            // ヘッダー用
            document.getElementById('stat-total-header').textContent = total;
            document.getElementById('stat-attended-header').textContent = attendedCount;
            
            // テーブル用
            document.getElementById('table-total-count').textContent = total;
        }

        // ==========================================
        // TAB 1: 当日受付 ロジック
        // ==========================================
        function renderCheckinGrid() {
            const grid = document.getElementById('checkin-grid');
            const emptyState = document.getElementById('checkin-empty-state');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterSelect').value;
            
            grid.innerHTML = '';
            
            let filtered = attendees;

            // ステータスで絞り込み
            if (filterStatus === 'pending') {
                filtered = filtered.filter(item => !item.attended);
            } else if (filterStatus === 'attended') {
                filtered = filtered.filter(item => item.attended);
            }

            // 検索キーワードで絞り込み
            if (query) {
                filtered = filtered.filter(item => {
                    // 検索対象：氏名、連絡先、全カスタム項目
                    const searchTarget = [
                        item.name || '',
                        item.contact || ''
                    ];
                    customFields.forEach(field => {
                        if(item[field]) searchTarget.push(item[field]);
                    });
                    
                    return searchTarget.some(val => val.toLowerCase().includes(query));
                });
            }

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border transition-all duration-300 relative overflow-hidden flex flex-col justify-between min-h-[140px]
                    ${item.attended 
                        ? 'bg-emerald-50 border-emerald-200 shadow-sm' 
                        : 'bg-white border-slate-200 shadow-sm hover:shadow-md hover:border-slate-300'}`;
                
                // 背景の装飾アイコン（受付済みの場合はチェックマークを表示）
                if (item.attended) {
                    card.innerHTML += `<i class="fa-solid fa-check text-[100px] text-emerald-100/50 absolute -right-4 -bottom-4 z-0 pointer-events-none transform -rotate-12"></i>`;
                }

                const toggleBtnHtml = item.attended
                    ? `<button onclick="toggleAttendance('${item.id}')" class="w-full bg-white border border-emerald-200 text-emerald-600 hover:bg-emerald-100 py-2.5 rounded-xl font-bold text-sm transition-colors shadow-sm z-10 relative">
                         <i class="fa-solid fa-arrow-rotate-left mr-1"></i> 受付取消
                       </button>`
                    : `<button onclick="toggleAttendance('${item.id}')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm shadow-emerald-500/30 z-10 relative">
                         <i class="fa-solid fa-check mr-1"></i> 出席にする
                       </button>`;

                // 氏名のみ表示するシンプルな構造
                card.innerHTML += `
                    <div class="relative z-10 mb-4 flex-1 flex flex-col justify-center">
                        <h3 class="font-bold text-lg text-slate-800 break-words leading-tight">${escapeHtml(item.name)}</h3>
                    </div>
                    ${toggleBtnHtml}
                `;
                grid.appendChild(card);
            });
        }

        function toggleAttendance(id) {
            const index = attendees.findIndex(a => a.id === id);
            if (index !== -1) {
                attendees[index].attended = !attendees[index].attended;
                // 受付時刻の記録/削除
                if(attendees[index].attended) {
                    attendees[index].checkin_time = new Date().toISOString();
                } else {
                    delete attendees[index].checkin_time;
                }
                saveData();
                updateAllViews();
                
                if (attendees[index].attended) {
                    showToast(`${attendees[index].name} さんの受付を完了しました。`);
                }
            }
        }

        // ==========================================
        // TAB 2: 管理・登録・設定 ロジック
        // ==========================================
        
        // --- カスタム項目管理 ---
        function renderCustomFieldsSettings() {
            const container = document.getElementById('custom-fields-container');
            container.innerHTML = '';
            
            if (customFields.length === 0) {
                container.innerHTML = `<span class="text-sm text-slate-400 italic">追加された項目はありません</span>`;
                return;
            }

            customFields.forEach(field => {
                const tag = document.createElement('div');
                tag.className = "bg-indigo-50 border border-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2";
                tag.innerHTML = `
                    <span class="font-medium">${escapeHtml(field)}</span>
                    <button onclick="removeCustomField('${escapeHtml(field)}')" class="text-indigo-400 hover:text-indigo-600 transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(tag);
            });
        }

        function handleAddCustomField(e) {
            e.preventDefault();
            const input = document.getElementById('new-field-input');
            const newField = input.value.trim();
            
            if (newField && !customFields.includes(newField)) {
                customFields.push(newField);
                input.value = '';
                saveData();
                renderCustomFieldsSettings();
                renderAddForm();
                renderManageTable();
                renderCheckinGrid();
                showToast(`項目「${newField}」を追加しました。`);
            }
        }

        function removeCustomField(field) {
            // カスタムフィールドを削除。既存データの該当プロパティはそのまま残るが無視される
            customFields = customFields.filter(f => f !== field);
            saveData();
            renderCustomFieldsSettings();
            renderAddForm();
            renderManageTable();
            renderCheckinGrid();
            showToast(`項目「${field}」を削除しました。`);
        }

        // --- 登録フォーム ---
        function renderAddForm() {
            const container = document.getElementById('dynamic-form-fields');
            
            // 基本項目
            let html = `
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">氏名 <span class="text-red-500">*</span></label>
                    <input type="text" id="add-name" required class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">連絡先</label>
                    <input type="text" id="add-contact" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-sm">
                </div>
            `;
            
            // カスタム項目
            customFields.forEach(field => {
                html += `
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">${escapeHtml(field)}</label>
                        <input type="text" data-custom-field="${escapeHtml(field)}" class="custom-field-input w-full px-4 py-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-sm">
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function handleAddAttendee(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('add-name');
            const contactInput = document.getElementById('add-contact');
            
            if (!nameInput.value.trim()) return;

            const newAttendee = {
                id: 'id_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                name: nameInput.value.trim(),
                contact: contactInput.value.trim(),
                attended: false
            };

            // カスタム項目の値を取得
            document.querySelectorAll('.custom-field-input').forEach(input => {
                const fieldName = input.getAttribute('data-custom-field');
                newAttendee[fieldName] = input.value.trim();
            });

            attendees.unshift(newAttendee); // 先頭に追加
            saveData();
            
            // フォームリセット
            e.target.reset();
            updateAllViews();
            
            showToast(`${newAttendee.name} さんを登録しました。`);
        }

        // --- 管理テーブル ---
        function renderManageTable() {
            const thead = document.getElementById('manage-table-head');
            const tbody = document.getElementById('manage-table-body');
            
            // ヘッダー生成
            let thHTML = `
                <tr>
                    <th class="px-4 py-3 w-24 text-center">受付状態</th>
                    <th class="px-4 py-3">氏名</th>
                    <th class="px-4 py-3">連絡先</th>
            `;
            customFields.forEach(field => {
                thHTML += `<th class="px-4 py-3">${escapeHtml(field)}</th>`;
            });
            thHTML += `
                    <th class="px-4 py-3 w-16 text-center">操作</th>
                </tr>
            `;
            thead.innerHTML = thHTML;

            // ボディ生成
            tbody.innerHTML = '';
            if(attendees.length === 0) {
                const colSpan = 4 + customFields.length;
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-8 text-slate-400">データがありません</td></tr>`;
                return;
            }

            attendees.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 transition-colors";
                
                // 基本セル（受付状態をバッジ表示に変更）
                let tdHTML = `
                    <td class="px-4 py-3 text-center">
                        <span class="text-[11px] px-2.5 py-1 rounded-full font-bold whitespace-nowrap inline-block min-w-[60px] text-center ${
                            item.attended 
                                ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' 
                                : 'bg-slate-100 text-slate-500 border border-slate-200'
                        }">
                            ${item.attended ? '受付済' : '未受付'}
                        </span>
                    </td>
                    <td class="px-4 py-3 font-medium text-slate-800">${escapeHtml(item.name)}</td>
                    <td class="px-4 py-3 text-slate-500">${escapeHtml(item.contact || '')}</td>
                `;

                // カスタムフィールドのセル
                customFields.forEach(field => {
                    tdHTML += `<td class="px-4 py-3 text-slate-600">${escapeHtml(item[field] || '')}</td>`;
                });

                // 操作セル
                tdHTML += `
                    <td class="px-4 py-3 text-center">
                        <button onclick="deleteAttendee('${item.id}')" class="text-slate-400 hover:text-red-500 transition-colors" title="削除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                
                tr.innerHTML = tdHTML;
                tbody.appendChild(tr);
            });
        }

        function deleteAttendee(id) {
            const item = attendees.find(a => a.id === id);
            if (!item) return;
            
            // 簡易確認（ブラウザのアラートを避けるため直接削除）
            // UI上の工夫として、誤操作を防ぐならToastでUndo機能を付けるなどがベター。
            attendees = attendees.filter(a => a.id !== id);
            saveData();
            updateAllViews();
            showToast(`${item.name} さんのデータを削除しました。`);
        }

        // ==========================================
        // TAB 3: CSV入出力 ロジック
        // ==========================================
        
        // --- CSVエクスポート ---
        function exportCSV() {
            if (attendees.length === 0) {
                showToast('出力するデータがありません。', 'error');
                return;
            }

            // ヘッダー行を動的生成
            const headers = ['出欠状態', '受付時刻', '氏名', '連絡先', ...customFields];
            
            // データ行を生成
            const rows = attendees.map(item => {
                const checkinTime = item.checkin_time ? new Date(item.checkin_time).toLocaleString('ja-JP') : '';
                const rowData = [
                    item.attended ? '受付済' : '未受付',
                    checkinTime,
                    item.name,
                    item.contact || ''
                ];
                
                customFields.forEach(field => {
                    rowData.push(item[field] || '');
                });
                
                return rowData;
            });

            // CSV文字列作成 (BOM付きUTF-8)
            const csvContent = [headers, ...rows]
                .map(e => e.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(","))
                .join("\n");
            
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            link.setAttribute("download", `event_attendance_${dateStr}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('CSVファイルをダウンロードしました。');
        }

        // --- サンプルCSVダウンロード ---
        function downloadSampleCSV() {
            // 現在のカスタムフィールドを含むサンプルヘッダーを生成
            const headers = ['氏名', '連絡先', ...customFields];
            
            // サンプルデータ
            const sampleRows = [
                ['山田 太郎', '090-0000-0000'],
                ['鈴木 花子', 'suzuki@example.com']
            ];
            
            // カスタムフィールドのダミーデータを追加
            sampleRows.forEach(row => {
                customFields.forEach((field, i) => {
                    row.push(`サンプルデータ${i+1}`);
                });
            });

            const csvContent = [headers, ...sampleRows]
                .map(e => e.map(cell => `"${cell}"`).join(","))
                .join("\n");
                
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "sample_format.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- CSVインポート ---
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                processCSV(text);
                // 入力をリセットして同じファイルを再度選べるようにする
                event.target.value = '';
            };
            // UTF-8として読み込み
            reader.readAsText(file);
        }

        function processCSV(csvText) {
            // 簡易的なCSVパーサー（カンマ区切り、ダブルクォート考慮）
            const lines = [];
            let currentLine = [];
            let currentCell = '';
            let insideQuotes = false;

            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i+1];

                if (insideQuotes) {
                    if (char === '"' && nextChar === '"') {
                        currentCell += '"';
                        i++; // エスケープされたクォートをスキップ
                    } else if (char === '"') {
                        insideQuotes = false;
                    } else {
                        currentCell += char;
                    }
                } else {
                    if (char === '"') {
                        insideQuotes = true;
                    } else if (char === ',') {
                        currentLine.push(currentCell);
                        currentCell = '';
                    } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
                        currentLine.push(currentCell);
                        lines.push(currentLine);
                        currentLine = [];
                        currentCell = '';
                        if (char === '\r') i++; // \r\n の \n をスキップ
                    } else if (char !== '\r') {
                        currentCell += char;
                    }
                }
            }
            if (currentCell !== '' || currentLine.length > 0) {
                currentLine.push(currentCell);
                lines.push(currentLine);
            }

            if (lines.length < 2) {
                showToast('有効なデータが見つかりません。', 'error');
                return;
            }

            const headers = lines[0].map(h => h.trim());
            const dataLines = lines.slice(1).filter(line => line.join('').trim() !== '');

            // 必須列の確認
            const nameIndex = headers.indexOf('氏名');
            if (nameIndex === -1) {
                showToast('CSVに「氏名」列が必要です。', 'error');
                return;
            }

            const contactIndex = headers.indexOf('連絡先');

            // 新しいカスタムフィールドの検出
            const reservedHeaders = ['氏名', '連絡先', '出欠状態', '受付時刻'];
            let addedNewFields = false;
            
            headers.forEach((header, index) => {
                if (header && !reservedHeaders.includes(header)) {
                    if (!customFields.includes(header)) {
                        customFields.push(header);
                        addedNewFields = true;
                    }
                }
            });

            let importCount = 0;
            // データの登録
            dataLines.forEach(line => {
                const name = line[nameIndex] ? line[nameIndex].trim() : '';
                if (!name) return; // 氏名が空ならスキップ

                const newAttendee = {
                    id: 'id_' + Date.now() + '_' + Math.floor(Math.random() * 10000),
                    name: name,
                    contact: contactIndex !== -1 ? line[contactIndex].trim() : '',
                    attended: false
                };

                // その他の列をカスタムフィールドとして登録
                headers.forEach((header, index) => {
                    if (header && !reservedHeaders.includes(header)) {
                        newAttendee[header] = line[index] ? line[index].trim() : '';
                    }
                });

                attendees.push(newAttendee);
                importCount++;
            });

            saveData();
            
            // 画面の更新
            if(addedNewFields) {
                renderCustomFieldsSettings();
                renderAddForm();
            }
            updateAllViews();
            
            showToast(`${importCount}件のデータを読み込みました。`);
            switchTab('manage'); // 読み込み後に一覧画面へ移動
        }

        // ==========================================
        // ユーティリティ
        // ==========================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
